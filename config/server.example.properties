# Copy to config/server.properties; paths are relative to the parent of config/.
# auto listens on current LAN interfaces; an explicit private IPv4 is an optional override.
server.bind=auto
server.port=5050
server.maxPlayers=10
server.maxConnections=32
database.path=data/quiz.db
tls.keystore=certs/server.p12
# Secrets are read from console/process environment, never from this file.
# Phase timing is fixed: countdown 3s, answer reveal 3s, ranking 4.5s.
# Question count and duration are configured through the host UI.
registration.enabled=true
discovery.port=5051
# Hold a resumable student's seat during a temporary outage (1..300 seconds).
session.resumeGraceSeconds=60
